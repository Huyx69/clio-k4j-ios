name: ClioK4J
options:
  bundleIdPrefix: com.huyx69
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ClioK4J:
    type: application
    platform: iOS
    sources:
      - path: ClioK4J
        excludes:
          - "Resources/Info.plist"
          - "Resources/ClioK4J.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huyx69.cliok4j
        PRODUCT_NAME: ClioK4J
        INFOPLIST_FILE: ClioK4J/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClioK4J/Resources/ClioK4J.entitlements
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
