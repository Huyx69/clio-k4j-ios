name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest installed Xcode
        run: |
          set -e
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then LATEST=/Applications/Xcode.app; fi
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned, SideStore re-signs at install)
        run: |
          set -eo pipefail
          xcodebuild \
            -project ClioK4J.xcodeproj \
            -scheme ClioK4J \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENTITLEMENTS_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH="$(find build/dd/Build/Products/Release-iphoneos -maxdepth 2 -name '*.app' | head -n1)"
          echo "App: $APP_PATH"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          mkdir -p artifacts
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/artifacts/ClioK4J.ipa" Payload)
          ls -lh artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClioK4J-ipa
          path: artifacts/ClioK4J.ipa
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/ClioK4J.ipa
